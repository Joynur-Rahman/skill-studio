
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employability Assessment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f3f6fb;
            color: #202b3c;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px #00000010;
        }

        h1, h2 {
            color: #244b8a;
        }

        button {
            background: #2458a6;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 11px 18px;
            cursor: pointer;
            margin-top: 12px;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        .option {
            display: block;
            padding: 10px;
            margin: 8px 0;
            background: #f3f6fb;
            border-radius: 6px;
            cursor: pointer;
        }

        input[type="text"] {
            padding: 10px;
            width: 90%;
            max-width: 350px;
        }

        #timer {
            font-weight: bold;
            color: #b42318;
        }

        .hidden {
            display: none;
        }

        .topic {
            border-bottom: 1px solid #ddd;
            padding: 8px 0;
        }
    </style>
</head>

<body>
    <h1>Employability Assessment</h1>
    <p>Answer 10 questions to discover your strengths and areas for improvement.</p>

    <section class="card" id="startCard">
        <h2>Start assessment</h2>
        <label for="studentId">Student ID:</label><br><br>
        <input type="text" id="studentId" placeholder="Enter your student ID">
        <br>
        <button id="startButton" onclick="startAssessment()">
            Start assessment
        </button>
        <p id="startMessage"></p>
    </section>

    <section class="card hidden" id="quizCard">
        <p>
            Question <span id="questionNumber"></span> of 10
            &nbsp; | &nbsp;
            Time remaining: <span id="timer">10:00</span>
        </p>

        <h2 id="category"></h2>
        <p id="difficulty"></p>
        <h3 id="questionText"></h3>

        <div id="options"></div>

        <button id="nextButton" onclick="nextQuestion()">Next question</button>
        <button id="finishButton" onclick="finishAssessment()" class="hidden">
            Submit assessment
        </button>

        <p id="quizMessage"></p>
    </section>

    <section class="card hidden" id="resultCard">
        <h2>Your results</h2>
        <h3 id="score"></h3>

        <h3>Strengths</h3>
        <ul id="strengths"></ul>

        <h3>Areas to improve</h3>
        <ul id="weaknesses"></ul>

        <h3>Topic-wise results</h3>
        <div id="topicResults"></div>

        <h3>Recommendations</h3>
        <ul id="recommendations"></ul>

        <button onclick="location.reload()">Take another assessment</button>
    </section>

    <script>
        const API = "http://127.0.0.1:8000";

        let attemptId = null;
        let questions = [];
        let currentIndex = 0;
        let answers = {};
        let secondsLeft = 600;
        let timerInterval = null;
        let busy = false;

        async function startAssessment() {
            const studentId =
                document.getElementById("studentId").value.trim();

            const message = document.getElementById("startMessage");

            if (!studentId) {
                message.textContent = "Please enter your student ID.";
                return;
            }

            const startButton = document.getElementById("startButton");
            startButton.disabled = true;
            message.textContent = "Loading questions...";

            try {
                const response = await fetch(`${API}/assessment/start`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ student_id: studentId })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Could not start assessment.");
                }

                attemptId = data.attempt_id;
                questions = data.questions;
                secondsLeft = data.time_limit_seconds;
                currentIndex = 0;
                answers = {};

                document.getElementById("startCard").classList.add("hidden");
                document.getElementById("quizCard").classList.remove("hidden");

                showQuestion();
                updateTimer();

                timerInterval = setInterval(() => {
                    secondsLeft--;
                    updateTimer();

                    if (secondsLeft <= 0) {
                        finishAssessment();
                    }
                }, 1000);

            } catch (error) {
                message.textContent = error.message;
                startButton.disabled = false;
            }
        }

        function showQuestion() {
            const q = questions[currentIndex];

            document.getElementById("questionNumber").textContent =
                currentIndex + 1;
            document.getElementById("category").textContent = q.category;
            document.getElementById("difficulty").textContent =
                "Difficulty: " + q.difficulty;
            document.getElementById("questionText").textContent = q.question;

            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";

            q.options.forEach((option, index) => {
                const label = document.createElement("label");
                label.className = "option";

                const radio = document.createElement("input");
                radio.type = "radio";
                radio.name = "answer";
                radio.value = index;
                radio.checked = answers[q.id] === index;

                radio.addEventListener("change", () => {
                    answers[q.id] = index;
                });

                label.appendChild(radio);
                label.appendChild(document.createTextNode(" " + option));
                optionsDiv.appendChild(label);
            });

            document.getElementById("quizMessage").textContent = "";

            const isLast = currentIndex === questions.length - 1;
            document.getElementById("nextButton").classList.toggle("hidden", isLast);
            document.getElementById("finishButton").classList.toggle("hidden", !isLast);
        }

        function updateTimer() {
            const minutes = Math.floor(secondsLeft / 60);
            const seconds = secondsLeft % 60;

            document.getElementById("timer").textContent =
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");
        }

        function nextQuestion() {
            if (answers[questions[currentIndex].id] === undefined) {
                document.getElementById("quizMessage").textContent =
                    "Please select an answer before continuing.";
                return;
            }

            currentIndex++;
            showQuestion();
        }

        async function finishAssessment() {
            if (busy || !attemptId) return;
            busy = true;

            clearInterval(timerInterval);

            document.getElementById("nextButton").disabled = true;
            document.getElementById("finishButton").disabled = true;
            document.getElementById("quizMessage").textContent =
                "Submitting your answers...";

            try {
                // Save each selected answer to the backend.
                for (const q of questions) {
                    if (answers[q.id] !== undefined) {
                        const response = await fetch(`${API}/assessment/answer`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                attempt_id: attemptId,
                                question_id: q.id,
                                selected_answer: answers[q.id]
                            })
                        });

                        if (!response.ok) {
                            throw new Error("Could not save an answer.");
                        }
                    }
                }

                const response = await fetch(
                    `${API}/assessment/finish/${attemptId}`,
                    { method: "POST" }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || "Could not calculate results.");
                }

                displayResults(result);

            } catch (error) {
                document.getElementById("quizMessage").textContent =
                    error.message + " Please check the backend and try again.";
                document.getElementById("nextButton").disabled = false;
                document.getElementById("finishButton").disabled = false;
                busy = false;
            }
        }

        function displayResults(result) {
            document.getElementById("quizCard").classList.add("hidden");
            document.getElementById("resultCard").classList.remove("hidden");

            document.getElementById("score").textContent =
                `Score: ${result.score}/${result.total_questions} (${result.percentage}%)`;

            fillList("strengths", result.strengths, "No strong topics identified yet.");
            fillList("weaknesses", result.weaknesses, "No topics below 50% in this attempt.");

            const topicDiv = document.getElementById("topicResults");
            topicDiv.innerHTML = "";

            result.topic_results.forEach(item => {
                const div = document.createElement("div");
                div.className = "topic";
                div.textContent =
                    `${item.topic}: ${item.correct}/${item.total} correct (${item.percentage}%)`;
                topicDiv.appendChild(div);
            });

            const recommendationList = document.getElementById("recommendations");
            recommendationList.innerHTML = "";

            const entries = Object.entries(result.recommendations);

            if (entries.length === 0) {
                addListItem(recommendationList, "Keep practising to maintain your skills.");
            } else {
                entries.forEach(([topic, advice]) => {
                    addListItem(recommendationList, `${topic}: ${advice}`);
                });
            }
        }

        function fillList(elementId, items, emptyMessage) {
            const list = document.getElementById(elementId);
            list.innerHTML = "";

            if (!items || items.length === 0) {
                addListItem(list, emptyMessage);
            } else {
                items.forEach(item => addListItem(list, item));
            }
        }

        function addListItem(list, text) {
            const li = document.createElement("li");
            li.textContent = text;
            list.appendChild(li);
        }
    </script>
</body>
</html>
